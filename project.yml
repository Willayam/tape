name: Tape
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Tape:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAPE_BUNDLE_ID)
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tape
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Tape talks to your label printer over Bluetooth.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Tape-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Mac app signs itself locally, so it builds without an Apple developer account.
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
